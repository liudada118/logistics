server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/logistics_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: your_password_here
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: yuntu-logistics-jwt-secret-key-2026-must-be-at-least-256-bits-long
  expiration: 86400000  # 24 hours in milliseconds

logging:
  level:
    com.yuntu.logistics: debug
